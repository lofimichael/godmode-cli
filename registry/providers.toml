# Literal key names and provider guidance; credentials never belong in this file.
# Extend with <config-dir>/providers.toml or GODMODE_REGISTRY, merged by provider id.
# required means required for that provider, not enrollment in every provider.
schema = 1

[[provider]]
id = "github"
name = "GitHub"
purpose = "Account-wide repo, code, Actions, secrets, issue and PR automation for the owner's products"
login = "https://github.com/login"
console = "https://github.com/settings/personal-access-tokens/new?name=godmode&expires_in=366&administration=write&contents=write&workflows=write&actions=write&secrets=write&actions_variables=write&environments=write&issues=write&pull_requests=write"
docs = "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens"

  [[provider.key]]
  name = "GH_TOKEN"
  kind = "secret"
  required = true
  usage = "Authenticates gh CLI, HTTPS git pushes and REST calls so agents can create repos, push contents, edit workflows, run Actions, set secrets/variables, and manage issues and PRs under the owner's account."
  scope = "Fine-grained PAT with resource owner = your personal account, Repository access = All repositories, and write on Administration, Contents, Workflows, Actions, Secrets, Variables, Environments, Issues and Pull requests; fall back to a classic PAT with repo + workflow scopes only if fine-grained is blocked."
  steps = ["Sign in; open the console URL (Settings > Developer settings > Personal access tokens > Fine-grained tokens).", "Name it godmode; pick Expiration (1-366 days, or none); Resource owner = your personal account.", "Repository access: All repositories, so repos the agent creates later are covered.", "Write: Administration, Contents, Workflows, Actions, Secrets, Variables, Environments, Issues, Pull requests.", "Generate token; copy the github_pat_... value once (never shown again) and paste it here.", "If fine-grained is blocked: Tokens (classic) > Generate new token (classic) with repo + workflow scopes."]
  format = "fine-grained starts with github_pat_; classic starts with ghp_"
  prefixes = ["github_pat_", "ghp_"]
  verify = "Read /user with an authenticated GitHub client. This verifies identity; separately verify repository and workflow permissions."

[[provider]]
id = "cloudflare"
name = "Cloudflare"
purpose = "Provision and operate Workers, D1, R2, KV, Queues, Workflows, DNS, Email Routing and logs via API/Wrangler"
login = "https://dash.cloudflare.com/login"
console = "https://dash.cloudflare.com/profile/api-tokens"
docs = "https://developers.cloudflare.com/fundamentals/api/get-started/create-token/"

  [[provider.key]]
  name = "CLOUDFLARE_API_TOKEN"
  kind = "secret"
  required = true
  usage = "Bearer credential for Cloudflare API and Wrangler to deploy Workers, manage data bindings and administer DNS and email for selected accounts and zones."
  scope = "Account Edit for the services agents will operate, including Workers Scripts, D1, R2, KV and Queues; account Read for discovery; Zone/DNS Edit for intended zones. Email Sending is a separate account permission."
  steps = ["Open My Profile > API Tokens > Create Token > Create Custom Token.", "Name it godmode and select the account resources agents should manage.", "Add Edit for required services; include D1 when releases apply database migrations.", "Add Zone/DNS permissions for the intended zones.", "Choose expiration and IP restrictions for your execution hosts, create, then copy the token."]
  format = "Opaque API token; older and newer token formats are supported."
  verify = "Use the appropriate user-token or account-token verification endpoint, then enumerate the intended account and zones."

[[provider]]
id = "vercel"
name = "Vercel"
purpose = "Create projects, deploy, and manage domains/env vars on the owner's Vercel team via CLI/REST API"
login = "https://vercel.com/login"
console = "https://vercel.com/account/tokens"
docs = "https://vercel.com/docs/accounts/access-tokens"

  [[provider.key]]
  name = "VERCEL_TOKEN"
  kind = "secret"
  required = true
  usage = "Bearer token for Vercel APIs and CLI --token authentication, used to create projects, deploy and manage configuration on the selected account or team."
  scope = "Create it while viewing your personal account, scope it to the target team with All Projects (team-wide read/write, no teamId needed); your role in that team must be Owner or Member so project creation, production env vars and domains are covered; choose Full Account only if you deliberately want every team plus personal resources."
  steps = ["Sign in at vercel.com; in the top-left scope switcher select your personal account, not a team.", "Open https://vercel.com/account/tokens and enter a descriptive name, e.g. godmode-agent.", "Scope: choose the target team, then All Projects (team-wide). Full Account = every team + personal.", "Choose an expiration (official range: 1 day to 1 year), then click Create.", "Copy the vcp_ token immediately; Vercel shows it once. Paste it as VERCEL_TOKEN.", "Your role in that team must be Owner or Member to create projects and set production env vars."]
  format = "starts with vcp_ (official docs; length after the prefix not documented); older tokens may be a bare 24-char alphanumeric string, per the API reference example"
  verify = "Read the project list for the selected team with an authenticated API client."

[[provider]]
id = "supabase"
name = "Supabase"
purpose = "Provision and manage Supabase projects, databases, auth, Edge Functions and keys via the Management API"
login = "https://supabase.com/dashboard/sign-in"
console = "https://supabase.com/dashboard/account/tokens"
docs = "https://supabase.com/docs/guides/platform/personal-access-tokens"

  [[provider.key]]
  name = "SUPABASE_ACCESS_TOKEN"
  kind = "secret"
  required = true
  usage = "Bearer token for the Supabase Management API (api.supabase.com/v1), the CLI (read automatically by `supabase` commands) and the MCP server, letting agents create projects, run migrations, configure auth, deploy Edge Functions and read project API keys."
  scope = "A scoped (not legacy) PAT over your organization with all its projects: org-level Organizations Read, Projects (account-wide) Read and Organization Projects Read-write; project-level Project Settings, Auth Config, Database, Migrations, Edge Functions and Edge Function Secrets Read-write; API Keys and API Key Secrets Read; expiry up to 1 year; never deploy it."
  steps = ["Sign in, open supabase.com/dashboard/account/tokens, generate a new token (not Create legacy token).", "Name it godmode; scope it to your organization with all its projects selected.", "Org permissions: Organizations Read; Projects (account-wide) Read; Organization Projects Read-write.", "Project permissions: Project Settings, Auth Config, Database, Migrations at Read-write.", "Also: Edge Functions and Edge Function Secrets Read-write; API Keys and API Key Secrets Read.", "Set expiry (up to 1 year), create, copy the sbp_fc... token now; it is shown only once."]
  format = "Personal access token beginning with sbp_; not a database password or project API key."
  prefixes = ["sbp_"]
  verify = "Read /v1/projects with the Management API client. This checks management access, not a database connection."

[[provider]]
id = "stripe"
name = "Stripe"
purpose = "Sell the owner's products via Stripe: products, prices, Checkout, Payment Links, subscriptions"
login = "https://dashboard.stripe.com/login"
console = "https://dashboard.stripe.com/test/apikeys"
docs = "https://docs.stripe.com/keys"

  [[provider.key]]
  name = "STRIPE_TEST_SECRET_KEY"
  kind = "secret"
  required = true
  usage = "Server-side authentication for every Stripe API call in the test sandbox: creating products, prices, customers, Checkout Sessions, Payment Links, subscriptions, invoices and webhook endpoints."
  scope = "In the sandbox use the default unrestricted sk_test_ key, or an rk_test_ restricted key with Write on Products, Prices, Customers, Checkout Sessions, Payment Links, Subscriptions, Invoices, Payment Intents, Charges and Refunds and Webhook Endpoints plus Read on Balance; no real money is at risk."
  steps = ["Sign in at dashboard.stripe.com; click the account picker > Switch to sandbox and open (or create) a sandbox.", "Go to dashboard.stripe.com/test/apikeys (Developers > API keys) and confirm the sandbox banner at the top.", "Either reveal the default Secret key (sk_test_) or click Create restricted key for an rk_test_ key.", "For a restricted key, name it godmode-test and set Write on the resource groups agents need; Create key.", "If prompted, complete verification (email/SMS code or two-factor), click the key value to copy, paste it.", "Add a note identifying the Godmode home where this key is stored."]
  format = "starts with sk_test_ (standard) or rk_test_ (restricted); length not officially documented"
  prefixes = ["sk_test_", "rk_test_"]
  forbid_prefixes = ["sk_live_", "rk_live_"]
  verify = "Read a permitted resource with the matching test/live SDK key and inspect livemode. This does not prove webhook or checkout readiness."

  [[provider.key]]
  name = "STRIPE_TEST_PUBLISHABLE_KEY"
  kind = "public"
  required = true
  usage = "Client-side key for Stripe.js, Elements, embedded Checkout and mobile SDKs in the test sandbox; it identifies the account and tokenizes payment details but cannot read account data or create charges."
  scope = "Public by design with no configurable scope; just make sure it comes from the same sandbox as STRIPE_TEST_SECRET_KEY because keys from different sandboxes are not interchangeable."
  steps = ["Open dashboard.stripe.com/test/apikeys while viewing the same sandbox as your secret key.", "Under Standard keys, find Publishable key (pk_test_); it is shown in full by default.", "Click the value to copy it and paste it when prompted; no verification code is needed."]
  format = "starts with pk_test_"
  prefixes = ["pk_test_"]
  forbid_prefixes = ["pk_live_"]
  verify = "Public keys identify an account/environment; verify them in the corresponding product integration."

  [[provider.key]]
  name = "STRIPE_LIVE_SECRET_KEY"
  kind = "secret"
  required = false
  usage = "Server-side key for real-money operations (live products, prices, Checkout, Payment Links, subscriptions, refunds) once the owner has explicitly authorized live mode."
  scope = "Prefer an rk_live_ restricted key with Write on the commerce resource groups agents actually use (Products, Prices, Customers, Checkout Sessions, Payment Links, Subscriptions, Invoices, Payment Intents, Charges and Refunds, Webhook Endpoints) and None on Payouts/Transfers unless deliberately granted; consider agent tagging and an access policy."
  steps = ["Only after explicit owner authorization: open dashboard.stripe.com/apikeys and switch to live mode.", "Click Create restricted key; when asked about intended use, optionally pick Authorizing agent access.", "Name it godmode-live, set Write only on the resource groups agents need, and click Create key.", "Complete two-factor verification, copy the rk_live_ value once (it cannot be revealed later), paste it.", "Attach an access policy (dashboard.stripe.com/api-access-policies) if agents run from fixed IPs."]
  format = "starts with rk_live_ (restricted, recommended) or sk_live_ (unrestricted)"
  prefixes = ["rk_live_", "sk_live_"]
  forbid_prefixes = ["sk_test_", "rk_test_"]
  verify = "Read a permitted resource with the matching test/live SDK key and inspect livemode. This does not prove webhook or checkout readiness."

  [[provider.key]]
  name = "STRIPE_LIVE_PUBLISHABLE_KEY"
  kind = "public"
  required = false
  usage = "Client-side key for live Stripe.js, Elements and embedded Checkout; public and paired with STRIPE_LIVE_SECRET_KEY."
  scope = "No scope to configure; it only needs to come from live mode of the same Stripe account as the live secret key."
  steps = ["Open dashboard.stripe.com/apikeys in live mode (toggle sandbox mode to live mode).", "Under Standard keys, copy the Publishable key (pk_live_); it is shown in full by default.", "Paste it when prompted; it is safe for client-side code but must match the live secret key's account."]
  format = "starts with pk_live_"
  prefixes = ["pk_live_"]
  forbid_prefixes = ["pk_test_"]
  verify = "Public keys identify an account/environment; verify them in the corresponding product integration."

[[provider]]
id = "posthog"
name = "PostHog"
purpose = "Agents provision PostHog orgs/projects, manage flags and insights, and query product analytics"
login = "https://us.posthog.com/login"
console = "https://us.posthog.com/settings/user-api-keys"
docs = "https://posthog.com/docs/api/personal-api-keys"

  [[provider.key]]
  name = "POSTHOG_PERSONAL_API_KEY"
  kind = "secret"
  required = true
  usage = "Bearer token for PostHog's private REST API so agents can create and configure organizations and projects, manage feature flags, insights and dashboards, and run HogQL queries."
  scope = "Set 'Organization & project access' to All access (or Organizations with your org, which covers all its projects) and grant organization:write, project:write, feature_flag:write, insight:write, dashboard:write, query:read and user:read - or pick the 'All access' preset (*) for one unrestricted key - and keep it local, never in frontend or deployed code."
  steps = ["Sign in at us.posthog.com (eu.posthog.com for EU) and open Settings > User > Personal API keys.", "Click Create a personal API Key, label it godmode and choose an expiration.", "Under 'Organization & project access' choose All access, or Organizations + your org (all its projects).", "Scopes: preset 'All access', or organization, project, feature_flag, insight write + query:read, user:read.", "Create it and copy the phx_ value immediately - PostHog never shows it again.", "Save it as POSTHOG_PERSONAL_API_KEY in the credential file shown by Godmode."]
  format = "Personal API key beginning with phx_; keep it local and server-side."
  prefixes = ["phx_"]
  verify = "Read the current user or organization on the correct US/EU API host with an authenticated client."

[[provider]]
id = "notion"
name = "Notion"
purpose = "Read, create and update pages, databases and comments in the owner's Notion workspace via the API"
login = "https://app.notion.com/login"
console = "https://app.notion.com/developers/connections"
docs = "https://developers.notion.com/guides/connections-and-tokens/internal-connections"

  [[provider.key]]
  name = "NOTION_API_KEY"
  kind = "secret"
  required = true
  usage = "Bearer token sent on every Notion API request so agents can read, insert and update pages, databases and comments in the workspace."
  scope = "Internal connection (workspace bot) with Read, Update and Insert content, Read and Insert comments, and user information enabled, granted access to the top-level pages/teamspaces agents should manage (child pages inherit)."
  steps = ["As a Workspace Owner, open app.notion.com/developers/connections (Build > Internal connections).", "Click Create a new connection (or + New connection), name it (e.g. Godmode), pick the workspace, create it.", "On the Configuration tab enable Read, Update and Insert content, Read and Insert comments, and user info.", "On the same tab, reveal and copy the API token (starts with ntn_).", "Grant pages: on each page use ... > Connections > + Add connection, or Content access > Edit access.", "Paste it as NOTION_API_KEY; verify with GET /v1/users/me (Notion-Version header required)."]
  format = "starts with ntn_ (tokens issued before 2024-09-25 start with secret_); Notion advises against regex validation"
  prefixes = ["ntn_", "secret_"]
  verify = "Use the authenticated API to retrieve a page explicitly shared with the connection."

[[provider]]
id = "gmail"
name = "Gmail"
purpose = "Read inboxes and send mail for agents over IMAP/SMTP using a Google account and app password"
login = "https://accounts.google.com/"
console = "https://myaccount.google.com/apppasswords"
docs = "https://support.google.com/accounts/answer/185833"
notes = ["App passwords are for IMAP/SMTP. They do not grant browser login, Google SSO, Workspace administration or Gmail API OAuth access. Some organizations and security configurations disable app passwords."]

  [[provider.key]]
  name = "GMAIL_USER"
  kind = "identity"
  required = true
  usage = "Full address of the Gmail or Workspace mailbox agents use for IMAP reads and SMTP sends; also the login name paired with the app password."
  scope = "Use a dedicated automation mailbox rather than the owner's primary account so agents get full inbox and send rights without exposing personal mail."
  steps = ["Choose the Google account that will send and read mail for automation; a dedicated account is safest.", "Use personal Gmail or a Workspace account whose admin allows 2-Step Verification and app passwords.", "Enter the full address, e.g. name@gmail.com or name@yourdomain.com, as GMAIL_USER."]
  format = "full email address, e.g. name@gmail.com or name@yourdomain.com"
  verify = "Authenticate an IMAP client and list mailboxes. This does not verify SMTP delivery or OAuth access."

  [[provider.key]]
  name = "GMAIL_APP_PASSWORD"
  kind = "secret"
  required = false
  usage = "Authenticates IMAP (imap.gmail.com:993 SSL) and SMTP (smtp.gmail.com:465 SSL or 587 TLS) logins so automation can read and send mail as GMAIL_USER."
  scope = "An app password grants full mail-protocol access with no finer scopes; keep it local, name it per host, and revoke it from the App passwords page if a host is compromised."
  steps = ["Sign in as GMAIL_USER and open https://myaccount.google.com/signinoptions/two-step-verification.", "Turn on 2-Step Verification with a phone prompt or authenticator; security-key-only 2SV blocks app passwords.", "Open https://myaccount.google.com/apppasswords, enter an app name such as godmode, and click Create.", "Copy the 16-character code immediately; Google shows it only once. Drop the spaces when saving.", "Paste it as GMAIL_APP_PASSWORD. Changing the Google password revokes every app password; regenerate then."]
  format = "16 characters shown as 4 groups of 4 (Google: \"16-digit passcode\"); store without spaces"
  verify = "Authenticate an IMAP client and list mailboxes. This does not verify SMTP delivery or OAuth access."

[[provider]]
id = "google"
name = "Google Ads + Search Console"
purpose = "Advertising workflows and owned-site search reporting with static service-account credentials"
login = "https://accounts.google.com/"
console = "https://console.cloud.google.com/iam-admin/serviceaccounts"
docs = "https://developers.google.com/google-ads/api/docs/oauth/service-accounts"
notes = ["Google Ads requires an enabled API, the appropriate API access level and Ads-account authorization; key storage alone establishes none of these.", "Keep Ads API usage within the approved advertising purpose. Search Console is a separate owned-site measurement API.", "Desktop OAuth is a separate attended flow. Keep refresh grants in private local state outside this credential file and Git; this CLI does not enroll or refresh user sessions. See docs/GOOGLE.md."]

  [[provider.key]]
  name = "GOOGLE_ADS_SERVICE_ACCOUNT_JSON"
  kind = "secret"
  required = true
  usage = "Static service-account JSON used by a Google Ads client to obtain short-lived OAuth tokens for account discovery, reporting and advertising operations."
  scope = "Use your Google Cloud project with Google Ads API enabled and the required API access level. Grant the service-account email the intended access level in the Ads account; Cloud IAM roles alone do not grant Ads access."
  steps = ["Enable Google Ads API in your Cloud project and obtain the required API access level.", "Open IAM & Admin > Service Accounts; create a service account for the Ads integration.", "Open the service account > Keys > Add key > Create new key > JSON.", "In Google Ads, open Admin > Access and security > Users and add its client_email.", "Choose the access level your workflow needs, such as Read only or Standard.", "Import downloaded JSON with --from-file, or paste raw JSON; Godmode compacts it."]
  format = "Raw service-account JSON with type=service_account, project_id, client_email and private_key. Do not add shell quotes."
  json = true
  verify = "Use an authorized Google API client to obtain an access token and read accessible Ads accounts or Search Console properties."

  [[provider.key]]
  name = "GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON"
  kind = "secret"
  required = false
  usage = "Optional static service-account key for Search Console APIs on properties explicitly granting this account access."
  scope = "Enable Search Console API in your Cloud project. Grant the service-account email access to each owned property. Use webmasters.readonly OAuth scope for reporting or webmasters for authorized writes."
  steps = ["Enable Google Search Console API in your Cloud project.", "Create a service account and download its JSON key from IAM & Admin > Service Accounts > Keys.", "Add its client_email to each Search Console property under Settings > Users and permissions.", "Choose property permissions and OAuth scopes for the operations you need.", "Import raw JSON with --from-file; user OAuth enrollment is a separate alternative."]
  format = "Raw service-account JSON with type, project_id, client_email and private_key. Do not add shell quotes."
  json = true
  verify = "Use an authorized Google API client to obtain an access token and read accessible Ads accounts or Search Console properties."

[[provider]]
id = "higgsfield"
name = "Higgsfield"
purpose = "Create images and video through Higgsfield API credentials"
login = "https://open.higgsfield.ai/auth/sign-in?redirect_url=%2Fapi-keys"
console = "https://open.higgsfield.ai/api-keys"
docs = "https://docs.higgsfield.ai/docs/authentication"
notes = ["Credentials identify an account; individual models may have separate restrictions. Generation can consume paid credits. This CLI does not fund an account or start generation."]

  [[provider.key]]
  name = "HIGGSFIELD_API_KEY_ID"
  kind = "identity"
  required = true
  usage = "Identifies the Higgsfield API credential; sent with the secret as `Authorization: Key ID:SECRET` to api.higgsfield.ai for image/video generation and request polling."
  scope = "Create a credential for the intended account. Use separate credentials for development and production; inspect account permissions and model access in the console."
  steps = ["Open Higgsfield Console and sign into the intended API account.", "Create an API credential; copy its key ID and secret when shown.", "Save the ID here and the matching secret as HIGGSFIELD_API_KEY_SECRET.", "API requests authenticate with Authorization: Key ID:SECRET."]
  format = "Key ID as issued by Higgsfield; preserve it exactly."
  verify = "Use a documented read-only request for an existing request owned by the account. A model error alone is not authentication proof."

  [[provider.key]]
  name = "HIGGSFIELD_API_KEY_SECRET"
  kind = "secret"
  required = true
  usage = "The secret half of the Higgsfield API credential; paired with the key ID in the Authorization header for every REST or SDK call, and all usage is billed to the owning account."
  scope = "The secret authorizes operations on the owning account. Keep it server-side and rotate it if exposed."
  steps = ["Create the credential in Higgsfield Console together with its key ID.", "Copy its secret here; never place it in URLs or client-side code.", "To rotate, create a replacement, update consumers, then revoke the old credential."]
  format = "Opaque secret issued together with the key ID."
  verify = "Use a documented read-only request for an existing request owned by the account. A model error alone is not authentication proof."

[[provider]]
id = "zernio"
name = "Zernio"
purpose = "Connect social accounts and operate publishing, scheduling and analytics through one API"
login = "https://zernio.com/signin"
console = "https://zernio.com/dashboard/api-keys"
docs = "https://docs.zernio.com/quickstart"

  [[provider.key]]
  name = "ZERNIO_API_KEY"
  kind = "secret"
  required = true
  usage = "Bearer credential for Zernio: manage profiles and connected accounts, prepare posts and operate authorized social publishing."
  scope = "Choose full access for reusable local account administration, or a restricted/profile-scoped key for one product. Keep reusable administrative credentials local."
  steps = ["Sign into the intended Zernio team and open Dashboard > API keys.", "Create a key named godmode with the access and resource groups the operator needs.", "Copy the key once and save it as ZERNIO_API_KEY.", "Connect existing native accounts through their authorization flow; the key does not create them.", "Use separate restricted credentials for unattended product runtimes."]
  format = "Opaque API key from the dashboard; full and restricted keys may use different prefixes."
  verify = "Read the profiles list with an authenticated API client and verify the intended team."

[[provider]]
id = "prodigi"
name = "Prodigi"
purpose = "Print-on-demand fulfilment: quote, order and track physical products via the Prodigi Print API"
login = "https://dashboard.prodigi.com/login"
console = "https://dashboard.prodigi.com/settings/api"
docs = "https://www.prodigi.com/print-api/docs/reference/"
notes = ["Sandbox orders are intended for testing. Check the API-version documentation before other writes: shared catalogue, artwork or account-setting operations may affect live data. Live orders can print, ship and incur charges."]

  [[provider.key]]
  name = "PRODIGI_SANDBOX_API_KEY"
  kind = "secret"
  required = true
  usage = "Sent as the X-API-Key header (v4: https://api.sandbox.prodigi.com; v5: https://api.prodigi.com/v5 with the sandbox_ prefix) so agents can test catalogue lookups, quotes and order flows without anything being printed, shipped or charged."
  scope = "Prodigi keys are account-wide with no scopes or roles, so use the Sandbox account's key for all agent testing, remembering that under v5 artwork, saved products, account settings, sales channels and billing are shared with the Live account."
  steps = ["Register once at https://dashboard.prodigi.com/register; this creates linked Live and Sandbox accounts.", "Log in (same credentials) to the Sandbox dashboard: https://sandbox-beta-dashboard.pwinty.com/settings/api", "Under 'API authentication' click 'Show key'; copy the X-API-Key value as shown into PRODIGI_SANDBOX_API_KEY.", "v4: send it to https://api.sandbox.prodigi.com. v5: send sandbox_<key> to https://api.prodigi.com/v5.", "Sandbox orders are never printed or charged, but v5 artwork, product and settings calls touch live data.", "'Regenerate API key' on that page invalidates the old key at once; repeat separately for Live if needed."]
  format = "Key from the matching dashboard; apply the environment prefix required by your API version."
  verify = "Read a catalogue product with the matching sandbox/live API configuration. Do not create an order to test a key."

  [[provider.key]]
  name = "PRODIGI_API_KEY"
  kind = "secret"
  required = false
  usage = "Sent as the X-API-Key header (v4: https://api.prodigi.com; v5: https://api.prodigi.com/v5 with the live_ prefix) to place real print-on-demand orders that are produced, shipped and billed, and to read live catalogue pricing, order status, shipments and invoices."
  scope = "Account-wide key with no scoping available, so add it deliberately only once sandbox flows are proven, keep it local, and regenerate immediately on any exposure."
  steps = ["Log in to the Live dashboard and open gear icon > API: https://dashboard.prodigi.com/settings/api", "Under 'API authentication' click 'Show key'; copy the X-API-Key value as shown into PRODIGI_API_KEY.", "v4: send it to https://api.prodigi.com. v5: send live_<key> to https://api.prodigi.com/v5.", "Live orders are printed, shipped and billed; add this key only when ready to fulfil real orders.", "Keys are per environment and not interchangeable; 'Regenerate API key' replaces the key immediately."]
  format = "Key from the matching dashboard; apply the environment prefix required by your API version."
  verify = "Read a catalogue product with the matching sandbox/live API configuration. Do not create an order to test a key."
