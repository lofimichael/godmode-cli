[package]
name = "godmode"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Onboard a machine into Godmode: one credential file, a disclaimer, and a terminal UI that never shows a secret."
license = "MIT"
repository = "https://github.com/lofimichael/godmode-cli"
readme = "README.md"
keywords = ["cli", "tui", "secrets", "onboarding", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "godmode"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
zeroize = "1.9"
libc = "0.2"
sha2 = "0.10"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
