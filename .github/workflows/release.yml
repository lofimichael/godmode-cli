name: Build draft release

# Explicit dispatch only. A tag does not publish or spend build minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag on main to package into a private draft
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Test and assemble readable executable
        run: |
          python3 -m unittest discover -s tests -p 'test_simple*.py'
          sh -n install.sh
          if command -v shellcheck >/dev/null; then shellcheck -s sh install.sh tests/install.sh tests/install-update.sh; fi
          sh tests/install.sh
          sh tests/install-update.sh
          python3 scripts/build.py --output target/godmode
          test "$(target/godmode --version)" = "godmode ${RELEASE_TAG#v}"
      - name: Package universal script and migration aliases
        shell: bash
        run: |
          mkdir -p package/docs dist
          cp target/godmode LICENSE README.md READTHIS.NFO install.sh package/
          # User docs only; docs/dev stays in the repository.
          cp docs/*.md package/docs/
          cp -R docs/images package/docs/
          mkdir package/lib
          cp lib/*.py package/lib/
          cp godmode.py providers.json VERSION package/
          mkdir package/scripts
          cp scripts/build.py package/scripts/
          tar -czf "dist/godmode-$RELEASE_TAG-unix.tar.gz" -C package godmode LICENSE README.md READTHIS.NFO install.sh docs lib godmode.py providers.json VERSION scripts
          # v0.6 updaters select native filenames. These are identical script
          # archives, not separately compiled binaries or platform builds.
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cp "dist/godmode-$RELEASE_TAG-unix.tar.gz" "dist/godmode-$RELEASE_TAG-$target.tar.gz"
          done
          # The README pipes this asset into sh; SHA256SUMS lists it for manual checks.
          cp install.sh dist/
          cd dist
          sha256sum ./*.tar.gz ./install.sh | sed 's#  ./#  #' > SHA256SUMS
      - name: Install the packaged archive
        run: |
          home=$(mktemp -d)
          HOME="$home" SHELL=/bin/sh sh dist/install.sh --archive "dist/godmode-$RELEASE_TAG-unix.tar.gz" --checksum dist/SHA256SUMS --path
          test "$("$home/.godmode/bin/godmode" --version)" = "godmode ${RELEASE_TAG#v}"
          cmp install.sh "$home/.godmode/bin/godmodeup"
          if tar -tzf "dist/godmode-$RELEASE_TAG-unix.tar.gz" | grep -q '^docs/dev'; then
            echo 'docs/dev must not be packaged' >&2
            exit 1
          fi
      - name: Create draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; inspect it before retrying.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.tar.gz install.sh SHA256SUMS \
            --verify-tag --draft --title "Godmode $RELEASE_TAG" --generate-notes
