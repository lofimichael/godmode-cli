name: Build draft release

# Explicit dispatch only. A tag does not publish or spend build minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag on main to package into a private draft
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    # The repository owner must opt in before a private runner can start.
    if: "!github.event.repository.private || vars.GODMODE_CI_ENABLED == 'true'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOPROXY: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate tag and source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -f vendor/modules.txt
      - name: Test the engine, native UI and installer
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          sh -n install.sh scripts/build-native.sh
          if command -v shellcheck >/dev/null; then shellcheck -s sh install.sh scripts/build-native.sh tests/install.sh tests/install-update.sh; fi
          sh tests/install.sh
          sh tests/install-update.sh
          sh scripts/build-native.sh
          go test -mod=vendor ./...
          test "$(target/godmode-native --version)" = "godmode ${RELEASE_TAG#v}"
          GODMODE_TEST_NATIVE_BINARY="$PWD/target/godmode-native" sh tests/install-update.sh
      - name: Package four native targets and complete source
        run: python3 scripts/package-native.py --output-dir dist
      - name: Install the native Linux archive
        run: |
          release_home=$(mktemp -d)
          HOME="$release_home" SHELL=/bin/sh sh dist/install.sh --archive "dist/godmode-$RELEASE_TAG-x86_64-unknown-linux-musl.tar.gz" --checksum dist/SHA256SUMS --path
          test "$("$release_home/.godmode/bin/godmode" --version)" = "godmode ${RELEASE_TAG#v}"
          cmp install.sh "$release_home/.godmode/bin/godmodeup"
          test ! -e "dist/godmode-$RELEASE_TAG-unix.tar.gz"
      - name: Create draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; inspect it before retrying.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.tar.gz install.sh SHA256SUMS \
            --verify-tag --draft --title "Godmode $RELEASE_TAG" --generate-notes
