name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Private repositories opt in after checking their included Actions budget.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private || vars.GODMODE_CI_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test readable source and terminal input
        run: python3 -m unittest discover -s tests -p 'test_simple*.py'
      - name: Installer and managed updates
        run: |
          sh -n install.sh
          if command -v shellcheck >/dev/null; then shellcheck -s sh install.sh tests/install.sh tests/install-update.sh; fi
          sh tests/install.sh
          sh tests/install-update.sh
      - name: Assemble the plain-text executable
        run: |
          python3 scripts/build.py --output target/godmode
          target/godmode --version
