name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Private repositories opt in after checking their included Actions budget.
    if: "!github.event.repository.private || vars.GODMODE_CI_ENABLED == 'true'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
            checks: '--full'
          - os: macos-15
            python: '3.14'
            checks: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The main-branch Linux release advisory needs tags and ancestry.
          fetch-depth: ${{ runner.os == 'Linux' && github.ref == 'refs/heads/main' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Install terminal screen test dependencies
        run: python3 -m pip install -r scripts/demo-requirements.txt
      - name: Check all supported behavior
        run: python3 scripts/check.py ${{ matrix.checks }} --jobs 2 --require-shellcheck
      - name: Compare runtime with the live release
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/release_status.py
      - name: Show check summary
        if: always()
        run: |
          if [ -f target/checks/summary.json ]; then cat target/checks/summary.json; fi
